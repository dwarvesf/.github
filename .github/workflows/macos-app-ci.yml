name: macos app ci

# Reusable CI for Dwarves macOS apps. The standard it implements: docs/macos-app-ci.md.
#
#   jobs:
#     ci:
#       uses: dwarvesf/.github/.github/workflows/macos-app-ci.yml@master
#       with:
#         project: MyApp/MyApp.xcodeproj
#         test_scheme: MyApp
#         release_scheme: MyAppDirect   # optional; built on pushes only
#
# Tests run on the macos-ui runner, a macOS VM on the Mac Mini, because app-hosted
# tests launch the app and must never open it on the Mini's own screen. The Release
# build runs on the Mini's host runner. Both keep DerivedData and SwiftPM checkouts
# on the runner's own disk between runs; no actions/cache round trip.
on:
  workflow_call:
    inputs:
      project:
        description: Path to the .xcodeproj or .xcworkspace
        type: string
        required: true
      test_scheme:
        description: Scheme whose tests run on every PR and push
        type: string
        required: true
      release_scheme:
        description: Scheme built in Release on pushes only; empty skips
        type: string
        default: ""
      pre_test_command:
        description: Cheap scripted checks to run before xcodebuild; empty skips
        type: string
        default: ""
      destination:
        type: string
        default: "platform=macOS,arch=arm64"
      test_runner:
        description: JSON label list for the test job
        type: string
        default: '["self-hosted", "macos-ui"]'
      build_runner:
        description: JSON label list for the Release build job
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.test_runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Pre-test checks
        if: inputs.pre_test_command != ''
        run: ${{ inputs.pre_test_command }}

      # Ad hoc signing: a runner LaunchAgent cannot reach a login-keychain signing key.
      - name: Test
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.test_scheme }}
          DEST: ${{ inputs.destination }}
        run: |
          set -o pipefail
          cache="$HOME/ci-cache/${GITHUB_REPOSITORY//\//_}"
          case "$PROJECT" in *.xcworkspace) kind=-workspace ;; *) kind=-project ;; esac
          xcodebuild test "$kind" "$PROJECT" -scheme "$SCHEME" -destination "$DEST" \
            -derivedDataPath "$cache/test" -clonedSourcePackagesDirPath "$HOME/ci-cache/spm" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            -quiet

      - name: Quit the test host
        if: always()
        run: pkill -f "$HOME/ci-cache/${GITHUB_REPOSITORY//\//_}/test/Build/" || true

  release:
    if: inputs.release_scheme != '' && github.event_name == 'push'
    runs-on: ${{ fromJSON(inputs.build_runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Release build
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.release_scheme }}
        run: |
          set -o pipefail
          cache="$HOME/ci-cache/${GITHUB_REPOSITORY//\//_}"
          case "$PROJECT" in *.xcworkspace) kind=-workspace ;; *) kind=-project ;; esac
          xcodebuild build "$kind" "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$cache/release" -clonedSourcePackagesDirPath "$HOME/ci-cache/spm" \
            CODE_SIGNING_ALLOWED=NO -quiet
